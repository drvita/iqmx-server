<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadowCard" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="50" y="52" fill="#0f172a" font-size="22" font-weight="800">Riesgos Financieros y Sanciones por Incumplimiento en México</text>
  <text x="50" y="80" fill="#64748b" font-size="14">Fundamento en la Ley Federal del Trabajo ante inspección de la STPS o conflicto laboral a partir de 2027</text>

  <!-- Card 1: Multa Mínima -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="270" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadowCard)" />
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#d97706" />
    <rect x="20" y="24" width="95" height="24" rx="6" fill="#fef3c7" />
    <text x="67" y="40" fill="#92400e" font-size="11" font-weight="800" text-anchor="middle">MULTA MÍNIMA</text>
    <text x="20" y="80" fill="#64748b" font-size="13" font-weight="600">Desde (250 UMA 2026)</text>
    <text x="20" y="125" fill="#d97706" font-size="34" font-weight="900">$29,327</text>
    <text x="20" y="150" fill="#64748b" font-size="12">MXN como piso mínimo</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="195" fill="#334155" font-size="12" font-weight="700">Art. 994, Fracc. IV Bis LFT</text>
    <text x="20" y="220" fill="#64748b" font-size="12">Aplica por no llevar el registro</text>
    <text x="20" y="238" fill="#64748b" font-size="12">electrónico de jornada o</text>
    <text x="20" y="256" fill="#64748b" font-size="12">no entregarlo a la autoridad.</text>
    <rect x="20" y="275" width="230" height="26" rx="6" fill="#fffbeb" />
    <text x="135" y="292" fill="#b45309" font-size="10" font-weight="800" text-anchor="middle">RIESGO DESDE EL DÍA 1</text>
  </g>

  <!-- Card 2: Multa Máxima -->
  <g transform="translate(345, 110)">
    <rect x="0" y="0" width="270" height="320" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#shadowCard)" />
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#dc2626" />
    <rect x="20" y="24" width="100" height="24" rx="6" fill="#fee2e2" />
    <text x="70" y="40" fill="#991b1b" font-size="11" font-weight="800" text-anchor="middle">MULTA MÁXIMA</text>
    <text x="20" y="80" fill="#64748b" font-size="13" font-weight="600">Hasta (5,000 UMA 2026)</text>
    <text x="20" y="125" fill="#dc2626" font-size="34" font-weight="900">$586,550</text>
    <text x="20" y="150" fill="#64748b" font-size="12">MXN según criterio de ley</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#f1f5f9" stroke-width="1" />
    <text x="20" y="195" fill="#334155" font-size="12" font-weight="700">Alcance por lineamientos</text>
    <text x="20" y="220" fill="#64748b" font-size="12">La STPS definirá en sus</text>
    <text x="20" y="238" fill="#64748b" font-size="12">lineamientos los criterios de</text>
    <text x="20" y="256" fill="#64748b" font-size="12">aplicación y reincidencia.</text>
    <rect x="20" y="275" width="230" height="26" rx="6" fill="#fef2f2" />
    <text x="135" y="292" fill="#b91c1c" font-size="10" font-weight="800" text-anchor="middle">ALTO IMPACTO FINANCIERO</text>
  </g>

  <!-- Card 3: Mejor Preparado con Evidencia -->
  <g transform="translate(640, 110)">
    <rect x="0" y="0" width="270" height="320" rx="16" fill="#1e1b4b" filter="url(#shadowCard)" />
    <rect x="20" y="24" width="135" height="24" rx="6" fill="#312e81" />
    <text x="87" y="40" fill="#a5b4fc" font-size="11" font-weight="800" text-anchor="middle">RESPALDO PROBATORIO</text>
    <text x="20" y="80" fill="#cbd5e1" font-size="13" font-weight="600">Ante inspecciones o demandas</text>
    <text x="20" y="118" fill="#ffffff" font-size="21" font-weight="900">Mejor Preparado</text>
    <text x="20" y="144" fill="#ffffff" font-size="21" font-weight="900">con Evidencia Real</text>
    <line x1="20" y1="170" x2="250" y2="170" stroke="#3730a3" stroke-width="1" />
    <text x="20" y="195" fill="#818cf8" font-size="12" font-weight="700">Art. 784 y 804 LFT</text>
    <text x="20" y="220" fill="#cbd5e1" font-size="12">El patrón debe conservar y</text>
    <text x="20" y="238" fill="#cbd5e1" font-size="12">exhibir controles de asistencia.</text>
    <text x="20" y="256" fill="#cbd5e1" font-size="12">Un registro electrónico confiable</text>
    <text x="20" y="274" fill="#cbd5e1" font-size="12">brinda mayor evidencia objetiva.</text>
    <rect x="20" y="285" width="230" height="22" rx="6" fill="#3730a3" />
    <text x="135" y="300" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">EVIDENCIA DIGITAL EXPORTABLE</text>
  </g>
</svg>