<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadowCmp" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="50" y="52" fill="#0f172a" font-size="22" font-weight="800">Control de Asistencia en México: Papel vs. Registro Electrónico (2027)</text>
  <text x="50" y="80" fill="#64748b" font-size="14">Lo que exige el Art. 132, Fracc. XXXIV de la LFT a partir del 1° de enero de 2027</text>

  <!-- Column 1: MÉTODOS OBSOLETOS -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="410" height="320" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#shadowCmp)" />
    <rect x="0" y="0" width="410" height="56" rx="16" fill="#fee2e2" />
    <rect x="0" y="44" width="410" height="12" fill="#fee2e2" />
    <text x="24" y="36" fill="#991b1b" font-size="15" font-weight="800">MÉTODOS TRADICIONALES (EN RIESGO)</text>

    <text x="24" y="92" fill="#7f1d1d" font-size="14" font-weight="700">✕ Listas en papel o libretas de firma</text>
    <text x="24" y="112" fill="#991b1b" font-size="12">Fáciles de extraviar, alterar o llenar a destiempo.</text>

    <text x="24" y="150" fill="#7f1d1d" font-size="14" font-weight="700">✕ Hojas de Excel llenadas manualmente</text>
    <text x="24" y="170" fill="#991b1b" font-size="12">No garantizan registro electrónico ni marca de tiempo real.</text>

    <text x="24" y="208" fill="#7f1d1d" font-size="14" font-weight="700">✕ "De palabra" o sin control de comida/salida</text>
    <text x="24" y="228" fill="#991b1b" font-size="12">Sin evidencia objetiva si la STPS solicita el historial.</text>

    <rect x="24" y="256" width="362" height="44" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
    <text x="205" y="282" fill="#b91c1c" font-size="12.5" font-weight="800" text-anchor="middle">Exposición a multas desde $29,327 MXN (250 UMA)</text>
  </g>

  <!-- Column 2: REGISTRO ELECTRÓNICO CONFIABLE -->
  <g transform="translate(500, 110)">
    <rect x="0" y="0" width="410" height="320" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2.5" filter="url(#shadowCmp)" />
    <rect x="0" y="0" width="410" height="56" rx="16" fill="#059669" />
    <rect x="0" y="44" width="410" height="12" fill="#059669" />
    <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="800">REGISTRO ELECTRÓNICO (PREPARADO 2027)</text>

    <text x="24" y="92" fill="#065f46" font-size="14" font-weight="700">✓ Marca exacta de inicio, comida y fin</text>
    <text x="24" y="112" fill="#475569" font-size="12">Con reconocimiento facial y prueba de vida real.</text>

    <text x="24" y="150" fill="#065f46" font-size="14" font-weight="700">✓ Control de jornada semanal de 46 h</text>
    <text x="24" y="170" fill="#475569" font-size="12">Alertas visuales cuando un colaborador se acerca al límite.</text>

    <text x="24" y="208" fill="#065f46" font-size="14" font-weight="700">✓ Reportes PDF STPS + CSV con sello SHA-256</text>
    <text x="24" y="228" fill="#475569" font-size="12">Respaldo digital inalterable, horas 2x/3x y acuse semanal.</text>

    <rect x="24" y="256" width="362" height="44" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="205" y="282" fill="#065f46" font-size="12.5" font-weight="800" text-anchor="middle">Mejor preparado con evidencia ante inspecciones</text>
  </g>
</svg>