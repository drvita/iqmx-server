services:
  db:
    image: pgvector/pgvector:pg15
    container_name: iqmx-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-iqmx}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webhook:
    platform: linux/amd64
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: iqmx-webhook
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - api
    env_file:
      - ./webhook/.env
    volumes:
      - ./webhook/app:/app/app
      - ./webhook/run.py:/app/run.py

  api:
    platform: linux/amd64
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: iqmx-api
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - db
    env_file:
      - ./api/.env
    volumes:
      - sqlite_data:/app/data
      - ./api/app:/app/app
      - ./api/run.py:/app/run.py

  chatbot:
    platform: linux/amd64
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: iqmx-chatbot
    restart: always
    ports:
      - "8002:8000"
    depends_on:
      - api
    env_file:
      - ./chatbot/.env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./chatbot/storage:/app/storage
      - ./chatbot/src:/app/src

  web:
    platform: linux/amd64
    build:
      context: ./web
      dockerfile: Dockerfile
      target: base
    container_name: iqmx-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev
    env_file:
      - ./web/.env
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  sqlite_data:
