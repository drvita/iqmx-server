# ==============================================================================
# IQISSMexico - Docker Compose Orchestration
# Pattern inspired by omadero / icefrut with log rotation & zero anonymous volumes
# ==============================================================================

x-base-common:
  &base-common # Local platform for Apple Silicon M3 (comment out in x86 production)
  platform: linux/arm64
  restart: unless-stopped
  networks:
    - iqmx-network
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # DATABASE (PostgreSQL / pgvector)
  # ----------------------------------------------------------------------------
  db:
    <<: *base-common
    image: pgvector/pgvector:pg15
    container_name: iqmx-db
    ports:
      - "${HOST_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-iqmx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iqmx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # BACKEND API & WEBHOOK GATEWAY (FastAPI)
  # ----------------------------------------------------------------------------
  api:
    <<: *base-common
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: iqmx-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    volumes:
      - sqlite-data:/app/data
      - ./api/app:/app/app
      - ./api/.env:/app/.env:ro
      - ./api/tests:/app/tests
      - ./api/run.py:/app/run.py
      - ./api/manage.py:/app/manage.py
      - ./api/scripts:/app/scripts
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ----------------------------------------------------------------------------
  # FRONTEND (Next.js)
  # ----------------------------------------------------------------------------
  web:
    <<: *base-common
    build:
      context: ./web
      dockerfile: Dockerfile
      target: deps
    container_name: iqmx-web
    ports:
      - "${HOST_WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev
    env_file:
      - ./web/.env
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next

  # ----------------------------------------------------------------------------
  # VOCERO CRM (Next.js + Drizzle / Better Auth)
  # ----------------------------------------------------------------------------
  crm:
    <<: *base-common
    build:
      context: ./crm
      dockerfile: Dockerfile
      target: deps
    container_name: iqmx-crm
    ports:
      - "${HOST_CRM_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/migrate.mjs && pnpm dev"
    env_file:
      - ./crm/.env
    volumes:
      - ./crm:/app
      - crm-node-modules:/app/node_modules
      - crm-next:/app/.next
      - crm-media:/data/media

networks:
  iqmx-network:
    name: iqmx-network
    driver: bridge

volumes:
  postgres-data:
    name: iqmx-postgres-data
  sqlite-data:
    name: iqmx-sqlite-data
  web-node-modules:
    name: iqmx-web-node-modules
  web-next:
    name: iqmx-web-next
  crm-node-modules:
    name: iqmx-crm-node-modules
  crm-next:
    name: iqmx-crm-next
  crm-media:
    name: iqmx-crm-media
