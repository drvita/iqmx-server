# ==============================================================================
# IQISSMexico - Docker Compose Orchestration
# Pattern inspired by omadero / icefrut with log rotation & zero anonymous volumes
# ==============================================================================

x-base-common:
  &base-common # Local platform for Apple Silicon M3 (comment out in x86 production)
  platform: linux/arm64
  restart: unless-stopped
  networks:
    - iqmx-network
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # DATABASE (PostgreSQL / pgvector)
  # ----------------------------------------------------------------------------
  db:
    <<: *base-common
    image: pgvector/pgvector:pg15
    container_name: iqmx-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-iqmx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iqmx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # BACKEND API & WEBHOOK GATEWAY (FastAPI)
  # ----------------------------------------------------------------------------
  api:
    <<: *base-common
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: iqmx-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    volumes:
      - sqlite-data:/app/data
      - ./api/app:/app/app
      - ./api/tests:/app/tests
      - ./api/run.py:/app/run.py
      - ./api/alembic:/app/alembic
      - ./api/alembic.ini:/app/alembic.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # CHATBOT AGENT (LangGraph + FastAPI)
  # ----------------------------------------------------------------------------
  chatbot:
    <<: *base-common
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: iqmx-chatbot
    ports:
      - "8002:8000"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./chatbot/.env
    volumes:
      - ./chatbot/storage:/app/storage
      - ./chatbot/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FRONTEND (Next.js)
  # ----------------------------------------------------------------------------
  web:
    <<: *base-common
    build:
      context: ./web
      dockerfile: Dockerfile
      target: deps
    container_name: iqmx-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev
    env_file:
      - ./web/.env
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next

networks:
  iqmx-network:
    name: iqmx-network
    driver: bridge

volumes:
  postgres-data:
    name: iqmx-postgres-data
  sqlite-data:
    name: iqmx-sqlite-data
  web-node-modules:
    name: iqmx-web-node-modules
  web-next:
    name: iqmx-web-next
